
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description"
        content="AidWise, your everyday first-aid companion.">
  <title>AidWise | First-Aid Companion</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <!-- iPhone Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AidWise">

  <!-- Android and desktop PWA support -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">


  <!-- Home Screen App Icon -->
  <link rel="apple-touch-icon" href="assets/icon.png">
</head>

<body>
  <!-- Reusable icons -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1z"/>
      <path d="M12 6v15"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="m12 3 10 18H2z"/>
      <path d="M12 9v5m0 3h.01"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M12 3 14 4l2-.3 1.4 1.4-.3 2L18 9l2 .8v2.4l-2 .8-.9 1.9.3 2-1.4 1.4-2-.3-2 1-2-1-2 .3-1.4-1.4.3-2L6 13l-2-.8V9.8L6 9l.9-1.9-.3-2L8 3.7l2 .3z"/>
      <circle cx="12" cy="11" r="3"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M4 12h16m-7-7 7 7-7 7"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="m15 5-7 7 7 7"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m9 5 7 7-7 7"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="7"/>
      <path d="m16 16 5 5"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M5 3 9 7l-2 3c1.5 3 4 5.5 7 7l3-2 4 4-2 3C10 22 2 14 2 5z"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 11v6m0-10h.01"/>
    </symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/>
    </symbol>
    <symbol id="i-cross" viewBox="0 0 24 24">
      <path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/>
    </symbol>
    <symbol id="i-person" viewBox="0 0 24 24">
      <circle cx="12" cy="4" r="2.3"/>
      <path d="M12 7v8m-5-5 5-2 5 2m-5 5-5 6m5-6 5 6"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20M12 2c-6 6-6 14 0 20m0-20c6 6 6 14 0 20"/>
    </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="M12 2 21 6v6c0 6-4 9-9 10-5-1-9-4-9-10V6z"/>
      <path d="M12 7v10M7 12h10"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m4 12 5 5L20 6"/>
    </symbol>
  </svg>

  <div class="ambient-glow"></div>

    <main id="app-view" class="app-view" tabindex="-1">
      <!-- Pages are displayed here by script.js -->
    </main>

  <!-- Floating navigation -->
  <nav id="bottom-nav" class="glass-nav"
       aria-label="Main navigation">
    <div class="glass-reflection"></div>
    <div class="nav-selection"></div>

    <button class="nav-button active"
            data-nav="home" aria-label="Home" title="Home">
      <svg class="nav-icon"><use href="#i-home"></use></svg>
      <span class="sr-only">Home</span>
    </button>

    <button class="nav-button"
            data-nav="guide" aria-label="Guide" title="Guide">
      <svg class="nav-icon"><use href="#i-book"></use></svg>
      <span class="sr-only">Guide</span>
    </button>

    <button class="nav-button"
            data-nav="emergency" aria-label="Emergency"
            title="Emergency">
      <svg class="nav-icon"><use href="#i-alert"></use></svg>
      <span class="sr-only">Emergency</span>
    </button>

    <button class="nav-button"
            data-nav="settings" aria-label="Settings"
            title="Settings">
      <svg class="nav-icon"><use href="#i-settings"></use></svg>
      <span class="sr-only">Settings</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
